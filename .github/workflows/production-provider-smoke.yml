name: Production provider smoke

on:
  workflow_dispatch:
    inputs:
      target_account_confirmation:
        description: >-
          Type I CONFIRM THIS IS A DEDICATED DISPOSABLE PRODUCTION ACCOUNT
          to authorize destructive smoke-test cleanup on that account.
        required: true
        type: string
      stripe_mode_confirmation:
        description: >-
          Type I AUTHORIZE LIVE-MODE STRIPE CHECKOUT SESSION CREATION WITHOUT PAYMENT
          to confirm the production run may create a live-mode Checkout session.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production provider smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CI: true
      E2E_BASE_URL: https://moto-track.net
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      PRODUCTION_PROVIDER_SMOKE: true
      PROVIDER_SMOKE_MARKER: PROVIDER-SMOKE-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET_ACCOUNT_CONFIRMATION: ${{ inputs.target_account_confirmation }}
      STRIPE_MODE_CONFIRMATION: ${{ inputs.stripe_mode_confirmation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Require smoke credentials
        run: |
          if [ "$TARGET_ACCOUNT_CONFIRMATION" != "I CONFIRM THIS IS A DEDICATED DISPOSABLE PRODUCTION ACCOUNT" ]; then
            echo "Confirm the target is a dedicated disposable production account before running this workflow." >&2
            exit 1
          fi
          if [ "$STRIPE_MODE_CONFIRMATION" != "I AUTHORIZE LIVE-MODE STRIPE CHECKOUT SESSION CREATION WITHOUT PAYMENT" ]; then
            echo "Explicit confirmation of live-mode Checkout creation is required." >&2
            exit 1
          fi
          for value in E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "$value is required for production provider smoke." >&2
              exit 1
            fi
          done
          echo "Preflight confirmations passed: dedicated disposable production account; live-mode Checkout session creation authorized. No payment will be completed."

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production provider smoke
        run: >-
          npx playwright test tests/e2e/production-provider-smoke.spec.ts
          --project authenticated --workers 1 --trace retain-on-failure

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-provider-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
