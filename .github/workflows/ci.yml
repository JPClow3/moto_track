name: CI

on:
  workflow_dispatch:
    inputs:
      full_diagnostics:
        description: Collect all E2E failures instead of stopping at the first
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  # Manual diagnostics must not cancel, or be cancelled by, PR validation.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    # A draft's green fast checks cannot satisfy the required full-suite gate.
    name: ${{ github.event.pull_request.draft && 'Draft checks' || 'Lint, Check, and Test' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_diagnostics && 50 || 40 }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moto_track_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moto_track_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Svelte Check
        run: npm run check

      - name: Unit Tests
        run: npm run test:unit

      - name: Verify database migrations
        run: npm run db:verify
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/moto_track_test

      - name: Production Build
        run: npm run build

      - name: Draft PR validation summary
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo 'Fast checks passed. Full authenticated E2E runs when this PR is marked ready for review and on every subsequent update.' >> "$GITHUB_STEP_SUMMARY"

      - name: Require authenticated E2E credentials
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          for value in E2E_USER_EMAIL E2E_USER_PASSWORD NEON_API_KEY NEON_PROJECT_ID; do
            if [ -z "${!value}" ]; then
              echo "$value is required for authenticated release coverage." >&2
              exit 1
            fi
          done

      - name: Install Playwright Browsers
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Set disposable branch expiry
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        id: e2e-expiry
        run: |
          echo "expires_at=$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create isolated Neon E2E branch
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        id: e2e-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}
          get_auth_url: true
          # Expiry also covers cancellation while creation outputs are pending.
          expires_at: ${{ steps.e2e-expiry.outputs.expires_at }}
          # Keep the action default: a custom timeout is rejected on Neon Free.

      - name: Apply pending migrations to isolated Neon E2E branch
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        run: |
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `E2E_DISPOSABLE_DATABASE_HOST=${new URL(process.env.DATABASE_URL).hostname}\n`);'
          npm run db:push
        env:
          DATABASE_URL: ${{ steps.e2e-neon.outputs.db_url }}

      - name: E2E Tests
        if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
        timeout-minutes: ${{ inputs.full_diagnostics && 40 || 30 }}
        run: npm run test:e2e -- --max-failures="$E2E_MAX_FAILURES"
        env:
          CI: true
          E2E_MAX_FAILURES: ${{ inputs.full_diagnostics && '0' || '1' }}
          DATABASE_URL: ${{ steps.e2e-neon.outputs.db_url }}
          E2E_DISPOSABLE_BRANCH: ${{ steps.e2e-neon.outputs.branch_id }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEON_AUTH_JWKS_URL: ${{ steps.e2e-neon.outputs.auth_url }}/.well-known/jwks.json
          PUBLIC_NEON_AUTH_URL: ${{ steps.e2e-neon.outputs.auth_url }}
          PUBLIC_SITE_URL: http://localhost:5187

      - name: Delete isolated Neon E2E branch
        if: always() && steps.e2e-neon.outcome != '' && steps.e2e-neon.outcome != 'skipped'
        timeout-minutes: 3
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # Fall back to the exact run name if cancellation lost the outputs.
          branch: ${{ steps.e2e-neon.outputs.branch_id || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          api_key: ${{ secrets.NEON_API_KEY }}
