name: Deploy reminder Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-reminders.yml"
      - "workers/reminders/**"
      - "src/lib/server/domain/reminders.ts"
      - "src/lib/server/domain/push-crypto.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-reminder-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production reminder Worker
    runs-on: ubuntu-latest
    env:
      # It must have Cloudflare Workers Scripts:Edit access for the account.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for production deployment." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: |
          npm run format:check
          npm run lint
          npm run check
          npm run test:unit
          npm run build

      - name: Deploy
        run: npm exec -- wrangler deploy -c workers/reminders/wrangler.toml
