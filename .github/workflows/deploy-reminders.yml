name: Deploy reminder Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-reminders.yml"
      - "workers/reminders/**"
      - "src/lib/server/domain/reminders.ts"
      - "src/lib/server/domain/push-crypto.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-reminder-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production reminder Worker
    runs-on: ubuntu-latest
    env:
      # It must have Cloudflare Workers Scripts:Edit access for the account.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment credential
        id: credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Worker deployment is waiting for CLOUDFLARE_API_TOKEN."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.credential.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.credential.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        if: steps.credential.outputs.configured == 'true'
        run: npm ci

      - name: Deploy
        if: steps.credential.outputs.configured == 'true'
        run: npm exec -- wrangler deploy -c workers/reminders/wrangler.toml
