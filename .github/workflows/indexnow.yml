name: IndexNow

permissions:
  contents: read

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      all_urls:
        description: Submit all public sitemap URLs for initial setup
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify IndexNow
        run: python scripts/submit-indexnow.py ${{ inputs.all_urls == true && '--all' || '' }}
